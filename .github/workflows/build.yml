name: Build and package
on:
  push:
    branches: [main, mac-support]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml and CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' entry"
            exit 1
          fi
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip
